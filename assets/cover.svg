<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="Timerise skills">
  <defs>
    <radialGradient id="blob-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0056b3" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0056b3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-accent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#059669" opacity="0.06"/>
    </pattern>
    <linearGradient id="fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="1"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- background: slate-50 + dot grid + two soft blobs -->
  <rect width="1600" height="800" fill="#f8fafc"/>
  <rect width="1600" height="800" fill="url(#dots)"/>
  <ellipse cx="1380" cy="700" rx="700" ry="420" fill="url(#blob-blue)"/>
  <ellipse cx="220" cy="110" rx="700" ry="440" fill="url(#blob-accent)"/>

  <!-- the index window -->
  <rect x="140" y="100" width="1320" height="600" rx="20" fill="#fff" fill-opacity="0.55" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
  <line x1="140" y1="160" x2="1460" y2="160" stroke="#059669" stroke-width="2" opacity="0.5"/>
  <circle cx="176" cy="130" r="6" fill="#059669" opacity="0.5"/>
  <circle cx="200" cy="130" r="6" fill="#059669" opacity="0.5"/>
  <circle cx="224" cy="130" r="6" fill="#059669" opacity="0.5"/>
  <!-- address bar -->
  <rect x="640" y="118" width="320" height="24" rx="12" fill="none" stroke="#059669" stroke-width="2" opacity="0.4"/>
  <rect x="700" y="126" width="200" height="8" rx="4" fill="#0056b3" opacity="0.3"/>

  <!-- skill cards: 6 published -->
  <g id="cards">
    <!-- 1 blog-markdown -->
    <g transform="translate(180 205)">
      <rect width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
      <rect x="28" y="28" width="56" height="56" rx="12" fill="url(#fill)" opacity="0.9"/>
      <rect x="42" y="44" width="28" height="4" rx="2" fill="#fff" opacity="0.75"/>
      <rect x="42" y="54" width="28" height="4" rx="2" fill="#fff" opacity="0.55"/>
      <rect x="42" y="64" width="18" height="4" rx="2" fill="#fff" opacity="0.4"/>
      <rect x="196" y="30" width="56" height="26" rx="13" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
      <rect x="28" y="112" width="168" height="16" rx="4" fill="#059669" opacity="0.55"/>
      <rect x="28" y="140" width="112" height="12" rx="4" fill="#0056b3" opacity="0.4"/>
    </g>
    <!-- 2 digital-signage -->
    <g transform="translate(500 205)">
      <rect width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
      <rect x="28" y="28" width="56" height="56" rx="12" fill="url(#fill)" opacity="0.9"/>
      <rect x="40" y="42" width="32" height="22" rx="3" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.75"/>
      <rect x="50" y="68" width="12" height="3" rx="1.5" fill="#fff" opacity="0.6"/>
      <rect x="196" y="30" width="56" height="26" rx="13" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
      <rect x="28" y="112" width="140" height="16" rx="4" fill="#059669" opacity="0.55"/>
      <rect x="28" y="140" width="188" height="12" rx="4" fill="#0056b3" opacity="0.4"/>
    </g>
    <!-- 3 help-center-markdown -->
    <g transform="translate(820 205)">
      <rect width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
      <rect x="28" y="28" width="56" height="56" rx="12" fill="url(#fill)" opacity="0.9"/>
      <circle cx="53" cy="53" r="11" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.75"/>
      <line x1="61" y1="61" x2="70" y2="70" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
      <rect x="196" y="30" width="56" height="26" rx="13" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
      <rect x="28" y="112" width="180" height="16" rx="4" fill="#059669" opacity="0.55"/>
      <rect x="28" y="140" width="96" height="12" rx="4" fill="#0056b3" opacity="0.4"/>
    </g>
    <!-- 4 island-mode-server -->
    <g transform="translate(1140 205)">
      <rect width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
      <rect x="28" y="28" width="56" height="56" rx="12" fill="url(#fill)" opacity="0.9"/>
      <rect x="40" y="40" width="32" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.75"/>
      <rect x="40" y="56" width="32" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.55"/>
      <circle cx="46" cy="45" r="1.8" fill="#fff" opacity="0.9"/>
      <circle cx="46" cy="61" r="1.8" fill="#fff" opacity="0.7"/>
      <rect x="196" y="30" width="56" height="26" rx="13" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
      <rect x="28" y="112" width="156" height="16" rx="4" fill="#059669" opacity="0.55"/>
      <rect x="28" y="140" width="132" height="12" rx="4" fill="#0056b3" opacity="0.4"/>
    </g>
    <!-- 5 ksef -->
    <g transform="translate(180 445)">
      <rect width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
      <rect x="28" y="28" width="56" height="56" rx="12" fill="url(#fill)" opacity="0.9"/>
      <path d="M44 40 h16 l8 8 v26 h-24 z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" opacity="0.75"/>
      <rect x="49" y="56" width="14" height="3" rx="1.5" fill="#fff" opacity="0.6"/>
      <rect x="49" y="63" width="10" height="3" rx="1.5" fill="#fff" opacity="0.45"/>
      <rect x="196" y="30" width="56" height="26" rx="13" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
      <rect x="28" y="112" width="96" height="16" rx="4" fill="#059669" opacity="0.55"/>
      <rect x="28" y="140" width="168" height="12" rx="4" fill="#0056b3" opacity="0.4"/>
    </g>
    <!-- 6 stripe-connect-subscriptions -->
    <g transform="translate(500 445)">
      <rect width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2.5" opacity="0.8"/>
      <rect x="28" y="28" width="56" height="56" rx="12" fill="url(#fill)" opacity="0.9"/>
      <rect x="40" y="44" width="32" height="22" rx="3" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.75"/>
      <rect x="40" y="51" width="32" height="4" fill="#fff" opacity="0.6"/>
      <rect x="196" y="30" width="56" height="26" rx="13" fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
      <rect x="28" y="112" width="200" height="16" rx="4" fill="#059669" opacity="0.55"/>
      <rect x="28" y="140" width="120" height="12" rx="4" fill="#0056b3" opacity="0.4"/>
    </g>
    <!-- 7, 8: coming shortly -->
    <rect x="820" y="445" width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 10" opacity="0.35"/>
    <rect x="1140" y="445" width="280" height="200" rx="16" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="10 10" opacity="0.35"/>
  </g>

  <!-- wordmark -->
  <text x="1508" y="758" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="38" letter-spacing="-1" fill="#059669" opacity="0.7">timerise·</text>
</svg>
